name: Firmware matrix

on:
  schedule:
    - cron: 0 18 * * *

permissions:
  contents: read
  actions: write

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-name: openclash-x86-25-source
            source-repository: immortalwrt/immortalwrt
            source-ref: v25
            config: .github/configs/openclash-x86.config
            openclash: true
          - build-name: openclash-R66s-25-source
            source-repository: immortalwrt/immortalwrt
            source-ref: v25
            config: .github/configs/openclash-R66s.config
            openclash: true
          - build-name: abt3000-ap-source
            source-repository: hanwckf/immortalwrt-mt798x
            source-ref: openwrt-21.02
            config: .github/configs/abt3000-ap.config
            base-config: defconfig/mt7981-ax3000.config
            openclash: false
    uses: ./.github/workflows/build-firmware.yml
    with:
      build-name: ${{ matrix.build-name }}
      source-repository: ${{ matrix.source-repository }}
      source-ref: ${{ matrix.source-ref }}
      config: ${{ matrix.config }}
      base-config: ${{ matrix.base-config }}
      openclash: ${{ matrix.openclash }}

  imagebuilder:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-name: openclash-x86-25-imagebuilder
            source-repository: immortalwrt/immortalwrt
            source-ref: v25
            config: .github/configs/openclash-x86.config
            target: x86/64
            profile: generic
          - build-name: openclash-R66s-25-imagebuilder
            source-repository: immortalwrt/immortalwrt
            source-ref: v25
            config: .github/configs/openclash-R66s.config
            target: rockchip/armv8
            profile: lunzn_fastrhino-r66s
    uses: ./.github/workflows/build-imagebuilder.yml
    with:
      build-name: ${{ matrix.build-name }}
      source-repository: ${{ matrix.source-repository }}
      source-ref: ${{ matrix.source-ref }}
      config: ${{ matrix.config }}
      target: ${{ matrix.target }}
      profile: ${{ matrix.profile }}
